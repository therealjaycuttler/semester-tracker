<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SyllabusPal: track every topic, ace every exam</title>
<style>
:root{
  --paper:#eef3ff; --grid:rgba(20,33,61,.07); --card:#ffffff; --card2:#f3f6ff;
  --ink:#14213d; --muted:#52607f; --bd:#14213d; --sh:#14213d; --track:#e1e8fb;
  --red:#ff5a5f; --orange:#ff9f1c; --yellow:#ffd93d; --lime:#8ad94b; --green:#22b573;
  --blue:#3a86ff; --grape:#8b6cff; --pink:#ff6fb5; --teal:#2ec4b6;
  --on:#14213d; --stamp:#0b7a47;
  --r-lg:24px; --r-md:16px; --r-sm:12px;
  --display:"Avenir Next","Arial Rounded MT Bold","Segoe UI Black","Arial Black",system-ui,sans-serif;
  --body:"Avenir Next","Segoe UI","Helvetica Neue",system-ui,-apple-system,sans-serif;
  --hand:"Bradley Hand","Noteworthy","Segoe Print","Chalkboard SE","Marker Felt","Comic Sans MS",cursive;
  color-scheme:light;
}
[data-theme="dark"]{
  --paper:#0f1526; --grid:rgba(160,180,255,.07); --card:#18203a; --card2:#222c50;
  --ink:#eef2ff; --muted:#a3b3de; --bd:#7d8dc4; --sh:#04060c; --track:#252f52; --stamp:#5ef0a8;
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme]){
    --paper:#0f1526; --grid:rgba(160,180,255,.07); --card:#18203a; --card2:#222c50;
    --ink:#eef2ff; --muted:#a3b3de; --bd:#7d8dc4; --sh:#04060c; --track:#252f52; --stamp:#5ef0a8;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;font:16px/1.5 var(--body);color:var(--ink);min-height:100vh;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
}
h1,h2,h3{font-family:var(--display);font-weight:900;letter-spacing:-.02em;line-height:1.1;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.grow{flex:1;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hide{display:none!important}
.hand{font-family:var(--hand);font-weight:700}
.muted{color:var(--muted)}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:2px solid var(--bd)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font:900 21px var(--display);letter-spacing:-.03em}
.logo-mark{width:38px;height:38px;border-radius:12px;background:var(--yellow);border:2px solid var(--bd);box-shadow:2px 2px 0 var(--sh);display:grid;place-items:center;transform:rotate(-6deg);font-size:20px}
.nav{display:flex;gap:4px;margin:0 auto;padding:4px;border:2px solid var(--bd);border-radius:14px;background:var(--card)}
.navbtn{border:0;background:transparent;padding:7px 15px;border-radius:10px;font-weight:800;display:flex;gap:7px;align-items:center}
.navbtn.on{background:var(--yellow);color:var(--on);box-shadow:inset 0 0 0 2px var(--bd)}
.top-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.icon-btn{width:40px;height:40px;border-radius:12px;border:2px solid var(--bd);background:var(--card);box-shadow:2px 2px 0 var(--sh);font-size:18px;display:grid;place-items:center}
.icon-btn:active{transform:translate(2px,2px);box-shadow:none}
.pill{border:2px solid var(--bd);background:var(--yellow);color:var(--on);border-radius:99px;padding:6px 12px;font-weight:800;box-shadow:2px 2px 0 var(--sh)}
.sync-pill{font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;border:2px solid var(--bd);background:var(--card2);display:inline-flex;align-items:center;gap:5px}
.user-chip{font-size:13px;font-weight:800;padding:5px 10px;border-radius:99px;border:2px solid var(--bd);background:var(--card);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bottom-nav{display:none}

main{max-width:1120px;margin:0 auto;padding:20px 16px 70px}
.stack{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.cols{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}

/* surfaces */
.card{min-width:0;background:var(--card);border:2px solid var(--bd);border-radius:var(--r-lg);box-shadow:5px 5px 0 var(--sh);padding:18px;position:relative}
.card h2{font-size:20px;margin-bottom:12px}
.card .sub{color:var(--muted);font-size:14px;margin:-6px 0 12px}

/* buttons & inputs */
.btn{border:2px solid var(--bd);border-radius:var(--r-sm);padding:9px 15px;font-weight:800;font-size:14px;background:var(--card);color:var(--ink);box-shadow:2px 2px 0 var(--sh);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--sh)}
.btn.primary{background:var(--yellow);color:var(--on)}
.btn.revise{background:var(--yellow);color:var(--on)}
.btn.danger{background:var(--red);color:var(--on)}
.btn.sm{padding:6px 11px;font-size:13px;box-shadow:2px 2px 0 var(--sh)}
.inp{width:100%;padding:11px 13px;border-radius:var(--r-sm);border:2px solid var(--bd);background:var(--card);color:var(--ink)}
.inp::placeholder{color:var(--muted)}
.icon{border:0;background:transparent;width:30px;height:30px;border-radius:99px;color:var(--muted);font-size:15px;display:grid;place-items:center;flex:none}
.icon:hover{background:var(--card2);color:var(--ink)}
.icon.on{color:#e08a00}

/* hero */
.hero{min-width:0;background:var(--yellow);color:var(--on);border:2px solid var(--bd);border-radius:28px;box-shadow:6px 6px 0 var(--sh);padding:26px;display:grid;grid-template-columns:1.25fr 1fr;gap:24px;align-items:center;position:relative}
.hero h1{font-size:clamp(28px,5vw,46px);margin-bottom:10px}
.hero .lead{font-size:17px;margin:0 0 16px;max-width:46ch}
.hero .tally{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.hero .tally span{background:#fff;border:2px solid #14213d;border-radius:99px;padding:3px 12px;font-weight:700;font-size:14px;color:#14213d}
.hero .btn{background:#fff;color:#14213d;border-color:#14213d;box-shadow:2px 2px 0 #14213d}
.hero .btn.dark{background:#14213d;color:#fff}
.meter{background:#fff;color:#14213d;border:2px solid #14213d;border-radius:20px;padding:18px;box-shadow:4px 4px 0 #14213d;transform:rotate(1.5deg)}
.meter .big{font:900 clamp(54px,9vw,84px)/1 var(--display);letter-spacing:-.04em}
.meter .big small{font-size:.42em;letter-spacing:0}
.meter .bar{background:#e1e8fb;border-color:#14213d;margin:10px 0 8px}
.meter .note{font-family:var(--hand);font-weight:700;font-size:20px}

/* stats */
.stats{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.stat{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--bd);border-radius:var(--r-md);box-shadow:3px 3px 0 var(--sh);padding:12px 14px}
.stat .ico{width:44px;height:44px;border-radius:12px;border:2px solid var(--bd);display:grid;place-items:center;font-size:21px;flex:none;color:var(--on)}
.stat b{display:block;font:900 26px/1.05 var(--display)}
.stat span{font-size:13px;color:var(--muted)}

/* progress bars */
.bar{height:18px;border:2px solid var(--bd);border-radius:99px;background:var(--track);overflow:hidden}
.bar.thin{height:11px}
.bar.tall{height:24px}
.fill{height:100%;width:0;border-right:2px solid var(--bd);transition:width .9s cubic-bezier(.2,.9,.25,1);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.38) 0 7px,transparent 7px 14px)}
.fill[data-w="0"]{border-right:0}
.pctb{display:inline-block;min-width:54px;text-align:center;border:2px solid var(--bd);border-radius:99px;padding:2px 10px;font-weight:900;color:var(--on);font-size:15px}

/* rings */
.ring{position:relative;display:inline-grid;place-items:center;flex:none}
.ring svg{position:absolute;inset:0}
.rfill{transition:stroke-dashoffset .9s cubic-bezier(.2,.9,.25,1)}
.ring-txt{position:relative;text-align:center;display:grid;gap:2px}
.ring-txt b{font-family:var(--display);font-weight:900;font-size:calc(var(--sz)*.25);line-height:1}
.ring-txt small{font-size:calc(var(--sz)*.095);color:var(--muted);line-height:1.1}

/* subject cards */
.subj-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr))}
.subj-card{background:var(--card);border:2px solid var(--bd);border-radius:var(--r-md);box-shadow:4px 4px 0 var(--sh);padding:14px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;cursor:pointer;border-top:10px solid var(--sc);transition:transform .08s,box-shadow .08s}
.subj-card:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--sh)}
.sc-top{display:flex;gap:10px;align-items:center}
.sc-top .em{width:42px;height:42px;border-radius:12px;border:2px solid var(--bd);background:var(--sc);display:grid;place-items:center;font-size:21px;flex:none}
.sc-top b{display:block;font-size:17px;line-height:1.2}
.sc-top small{color:var(--muted)}
.minisegs{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:4px}
.minisegs i{height:11px;border:2px solid var(--bd);border-radius:5px;background:var(--track)}
.chip{display:inline-flex;gap:6px;align-items:center;border:2px solid var(--bd);border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700;background:var(--card2);width:max-content;max-width:100%}
.chip.red{background:var(--red);color:var(--on)}
.chip.orange{background:var(--orange);color:var(--on)}
.chip.yellow{background:var(--yellow);color:var(--on)}
.chip.green{background:var(--lime);color:var(--on)}

/* charts */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:190px}
.wk-c{display:grid;grid-template-rows:20px 1fr 20px;height:100%;text-align:center;font-size:12px}
.wk-v{font-weight:800}
.wk-bar{display:flex;align-items:flex-end;justify-content:center}
.wk-bar i{display:block;width:100%;max-width:38px;border:2px solid var(--bd);border-bottom:0;border-radius:9px 9px 0 0;background:var(--blue)}
.wk-bar i.z{border:0;height:0}
.wk-c.today small{font-weight:900}
.wk-c.today .wk-bar i{background:var(--pink)}
.wk-c small{color:var(--muted)}
.donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut{width:136px;height:136px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;flex:none}
.donut .hole{width:84px;height:84px;border-radius:50%;background:var(--card);border:2px solid var(--bd);display:grid;place-items:center;text-align:center;line-height:1.05}
.donut .hole b{font:900 26px var(--display)}
.donut .hole small{font-size:11px;color:var(--muted)}
.legend{display:grid;gap:8px;font-size:14px}
.legend div{display:flex;gap:8px;align-items:center}
.legend i{width:16px;height:16px;border-radius:5px;border:2px solid var(--bd);display:inline-block}
.heat{display:grid;gap:6px;grid-template-columns:minmax(110px,1.3fr) repeat(var(--n),minmax(44px,1fr));align-items:center;overflow-x:auto;padding-bottom:4px}
.heat .hl{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heat .hc{height:38px;border:2px solid var(--bd);border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:13px;color:var(--on);background:var(--card2);cursor:pointer}
.heat .hc.none{color:var(--muted);font-weight:700;border-style:dashed}
.heat .hh{font-size:12px;color:var(--muted);text-align:center;font-weight:700}
.keybar{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted);align-items:center}
.keybar i{width:16px;height:16px;border:2px solid var(--bd);border-radius:5px;display:inline-block}

.list{display:grid;gap:10px}
.li{display:flex;gap:12px;align-items:center;padding:10px 12px;border:2px solid var(--bd);border-radius:14px;background:var(--card2)}
.li .em{font-size:22px}
.li b{display:block;line-height:1.25}
.li small{color:var(--muted)}

.badges{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.badge{border:2px solid var(--bd);border-radius:16px;padding:12px;text-align:center;box-shadow:3px 3px 0 var(--sh);background:var(--bg-c,var(--card2));color:var(--on)}
.badge:nth-child(odd){transform:rotate(-1.5deg)}
.badge:nth-child(even){transform:rotate(1.2deg)}
.badge .b-ico{font-size:30px}
.badge b{display:block;line-height:1.2}
.badge small{display:block;font-size:12px;line-height:1.25;margin-top:2px}
.badge.locked{background:transparent;border-style:dashed;box-shadow:none;color:var(--muted);transform:none}
.badge.locked .b-ico{filter:grayscale(1);opacity:.55}
.quote{font-family:var(--hand);font-weight:700;font-size:21px;text-align:center;padding:10px 20px;color:var(--ink)}

/* tracker */
.chips-row{display:flex;gap:10px;overflow-x:auto;padding:4px 4px 10px;margin:-4px}
.schip{flex:none;display:flex;gap:8px;align-items:center;border:2px solid var(--bd);border-radius:99px;padding:7px 14px;font-weight:800;background:var(--card);box-shadow:2px 2px 0 var(--sh)}
.schip.on{background:var(--sc,var(--yellow));color:var(--on)}
.schip.add{background:transparent;border-style:dashed;box-shadow:none}
.subj-head{border-top:12px solid var(--sc)}
.sh-top{display:flex;gap:14px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.emoji-badge{width:58px;height:58px;border-radius:16px;border:2px solid var(--bd);background:var(--sc);display:grid;place-items:center;font-size:30px;box-shadow:3px 3px 0 var(--sh);transform:rotate(-4deg);flex:none}
.sh-top h2{font-size:clamp(24px,4vw,34px);margin:0 0 6px}
.sh-body{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.sh-stats{flex:1;min-width:240px;display:grid;gap:10px}
.sh-stats .big{font-size:18px}
.sh-stats .big b{font:900 30px var(--display)}
.sh-stats .left-note{font-family:var(--hand);font-weight:700;font-size:21px}
.mini-stats{display:flex;gap:8px;flex-wrap:wrap}
.warn{background:var(--yellow);color:var(--on);border:2px dashed var(--bd);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700;margin-top:14px}
.segs{display:grid;grid-template-columns:repeat(var(--n),minmax(70px,1fr));gap:10px;margin-top:18px;overflow-x:auto;padding-bottom:4px}
.seg{display:grid;gap:5px;text-align:left;border:0;background:transparent;padding:0;min-width:0}
.seg .seg-l{font-weight:800;font-size:13px}
.seg .seg-p{font-size:12px;color:var(--muted);font-weight:700}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .inp{flex:1;min-width:180px;max-width:340px}
.fchip{border:2px solid var(--bd);background:var(--card);border-radius:99px;padding:6px 13px;font-weight:800;font-size:13px}
.fchip.on{background:var(--ink);color:var(--paper)}

.unit{padding:0;overflow:visible;scroll-margin-top:84px}
.unit>.bar{margin:0 18px 14px}
.unit-h{display:flex;gap:12px;align-items:center;padding:18px 18px 12px;cursor:pointer;border-radius:var(--r-lg)}
.ubadge{width:42px;height:42px;border-radius:13px;border:2px solid var(--bd);display:grid;place-items:center;font:900 19px var(--display);color:var(--on);flex:none}
.uname{font:900 19px/1.2 var(--display);letter-spacing:-.01em}
.usub{font-size:13px;color:var(--muted)}
.chev{font-size:18px;transition:transform .2s;color:var(--muted)}
.chev.open{transform:rotate(180deg)}
.unit-b{padding:0 18px 18px}
.topic{display:flex;gap:10px;align-items:center;padding:8px 8px 8px 6px;border-radius:12px;flex-wrap:wrap}
.topic:hover{background:var(--card2)}
.chk{width:28px;height:28px;border-radius:9px;border:2px solid var(--bd);background:var(--card);display:grid;place-items:center;flex:none;color:transparent;padding:0}
.chk[aria-checked="true"]{background:var(--green);color:var(--on)}
.chk.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.topic .t{flex:1;min-width:140px;cursor:pointer;overflow-wrap:anywhere;display:flex;align-items:center;gap:8px}
.topic.done .t-txt{color:var(--muted);text-decoration:line-through;text-decoration-thickness:2px}

/* 3-Dot Topic Status Controls */
.status-dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--bd);display:inline-block;flex:none;background:var(--track)}
.status-dot.s1{background:var(--red);box-shadow:0 0 0 2px rgba(255,90,95,.25)}
.status-dot.s2{background:var(--yellow);box-shadow:0 0 0 2px rgba(255,217,61,.35)}
.status-dot.s3{background:var(--green);box-shadow:0 0 0 2px rgba(34,181,115,.25)}

.status-group{display:inline-flex;align-items:center;gap:4px;background:var(--card2);border:2px solid var(--bd);border-radius:99px;padding:2px 6px;flex:none}
.dot-btn{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd);padding:0;display:grid;place-items:center;font-size:10px;font-weight:900;opacity:.42;transition:transform .1s,opacity .1s}
.dot-btn:hover{opacity:.85;transform:scale(1.08)}
.dot-btn.on{opacity:1;transform:scale(1.12);box-shadow:0 0 0 2px var(--ink)}
.dot-btn.r{background:var(--red);color:var(--on)}
.dot-btn.y{background:var(--yellow);color:var(--on)}
.dot-btn.g{background:var(--green);color:var(--on)}
.status-lbl{font-size:11px;font-weight:800;padding:0 4px;color:var(--muted)}
.status-lbl.s1{color:var(--red)}
.status-lbl.s2{color:#b58900}
[data-theme="dark"] .status-lbl.s2{color:var(--yellow)}
.status-lbl.s3{color:var(--green)}

.diffbtn{border:2px solid var(--bd);border-radius:99px;font-size:12px;font-weight:800;padding:1px 9px;background:transparent;color:var(--muted);border-style:dashed;flex:none}
.diffbtn.d1{background:var(--lime);color:var(--on);border-style:solid}
.diffbtn.d2{background:var(--orange);color:var(--on);border-style:solid}
.diffbtn.d3{background:var(--red);color:var(--on);border-style:solid}
.empty-u,.nomatch{padding:14px;color:var(--muted);border:2px dashed var(--bd);border-radius:12px;text-align:center;font-size:14px}
.addrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.addrow .inp{flex:1;min-width:160px}
.uacts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.stamp{position:absolute;top:-14px;right:70px;transform:rotate(-7deg);border:3px solid var(--stamp);color:var(--stamp);background:var(--card);border-radius:10px;padding:1px 12px;font:900 18px var(--display);z-index:2}
.stamp.slam{animation:slam .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes slam{0%{transform:rotate(-20deg) scale(3);opacity:0}100%{transform:rotate(-7deg) scale(1);opacity:1}}
.flash{animation:flash 1.2s}
@keyframes flash{0%,60%{box-shadow:0 0 0 6px var(--yellow),5px 5px 0 var(--sh)}100%{box-shadow:5px 5px 0 var(--sh)}}

/* focus */
.focus{display:grid;gap:22px;justify-items:center;text-align:center}
.modes{display:flex;gap:4px;padding:4px;border:2px solid var(--bd);border-radius:14px;background:var(--card2)}
.modes button{border:0;background:transparent;border-radius:10px;padding:7px 14px;font-weight:800}
.modes button.on{background:var(--yellow);color:var(--on);box-shadow:inset 0 0 0 2px var(--bd)}
.tm-ring b{font-size:calc(var(--sz)*.21)!important}
.durs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pickrow{display:grid;gap:10px;width:100%;max-width:440px;text-align:left}
.lbl{display:block;font-weight:800;font-size:14px;margin:12px 0 6px}
.lbl small{font-weight:600;color:var(--muted)}

/* empty */
.empty{text-align:center;padding:40px 20px;display:grid;gap:12px;justify-items:center}
.empty .big-emoji{font-size:56px;transform:rotate(-6deg)}
.empty h2{font-size:30px;margin:0}
.empty p{max-width:46ch;margin:0 0 6px;color:var(--muted)}

/* modal, toast */
.overlay{position:fixed;inset:0;background:rgba(10,15,35,.6);display:grid;place-items:center;padding:16px;z-index:60;overflow:auto}
.modal{background:var(--card);border:2px solid var(--bd);border-radius:var(--r-lg);box-shadow:6px 6px 0 var(--sh);max-width:500px;width:100%;max-height:92vh;overflow:auto;padding:22px}
.modal h3{font-size:24px;margin-bottom:6px}
.mactions{display:flex;gap:10px;margin-top:20px;align-items:center;flex-wrap:wrap}
.picks{display:flex;gap:8px;flex-wrap:wrap}
.pick{width:42px;height:42px;border-radius:12px;border:2px solid var(--bd);background:var(--card2);font-size:20px;display:grid;place-items:center;padding:0}
.pick.sw{border-radius:50%}
.pick.on{outline:3px solid var(--blue);outline-offset:2px}
.seg-opts{display:flex;gap:8px;flex-wrap:wrap}
.auth-divider{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--muted);font-size:13px;font-weight:700}
.auth-divider::before,.auth-divider::after{content:"";flex:1;border-top:2px dashed var(--bd)}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;display:grid;gap:8px;z-index:80;width:max-content;max-width:calc(100vw - 24px)}
.toast{background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:14px;font-weight:700;display:flex;gap:12px;align-items:center;box-shadow:3px 3px 0 var(--sh);animation:pop .3s}
.toast button{border:0;background:var(--yellow);color:var(--on);border-radius:8px;padding:3px 10px;font-weight:800}
.toast.out{opacity:0;transition:opacity .3s}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:10px}

@media (max-width:760px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .nav{display:none}
  .top-in{gap:8px}
  .top-r{margin-left:auto}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--paper);border-top:2px solid var(--bd);padding:8px 12px calc(8px + env(safe-area-inset-bottom));gap:8px}
  .bottom-nav .navbtn{flex:1;flex-direction:column;gap:0;padding:6px;font-size:12px;border-radius:12px}
  .bottom-nav .navbtn span:first-child{font-size:20px}
  main{padding-bottom:100px}
  .hero{grid-template-columns:1fr;padding:20px}
  .stamp{right:16px}
  #toasts{bottom:92px}
  .card{padding:16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

<body>

<header class="top">

</nav>

<div id="toasts" aria-live="polite"></div>
<input type="file" id="imp" accept="application/json,.json" hidden>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>Array.from(el.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const dayKey=d=>{d=d instanceof Date?d:new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const DAY=86400000;
const APP_TITLE='SyllabusPal: track every topic, ace every exam';

/* ---------- storage & cloud sync hooks ---------- */
const KEY='syllabuspal.v1';
let mem=null, persistent=true;
function readStore(){
  try{const r=window.localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){persistent=false;}
  if(mem){try{return JSON.parse(mem);}catch(e){}}
  return null;
}
function save(skipCloud){
  state.updatedAt=Date.now();
  const s=JSON.stringify(state);mem=s;
  try{window.localStorage.setItem(KEY,s);}catch(e){persistent=false;}
  if(!skipCloud&&typeof window.__syncToFirebase==='function'){
    window.__syncToFirebase(state);
  }
}
const defaults=()=>({v:1,name:'',theme:null,subjects:[],mins:{},sess:{},badges:{},active:null,pomo:{focus:25,short:5,long:15},updatedAt:0});
let state=Object.assign(defaults(),readStore()||{});
function normalizeState(st){
  st=Object.assign(defaults(),st||{});
  st.pomo=Object.assign({focus:25,short:5,long:15},st.pomo||{});
  ['mins','sess','badges'].forEach(k=>{if(!st[k]||typeof st[k]!=='object')st[k]={};});
  if(!Array.isArray(st.subjects))st.subjects=[];
  st.subjects.forEach(s=>{
    if(!Array.isArray(s.units))s.units=[];
    s.units.forEach(u=>{
      if(!Array.isArray(u.topics))u.topics=[];
      u.topics.forEach(t=>{
        if(typeof t.status!=='number'){
          t.status=t.done?3:0;
        }
        t.done=(t.status===3);
      });
    });
  });
  return st;
}
state=normalizeState(state);

const ui={view:'dashboard',filter:'all',q:'',prev:{},modal:null,focusSel:null,pop:null,popUnit:null};

/* ---------- data model ---------- */
const EMOJIS=['📚','💻','⚡','📐','🧪','🧬','📊','📝','🎨','🌐','🤖','🧠','🔬','⚙️','⚖️','💼'];
const COLORS=['#3a86ff','#8b6cff','#ff6fb5','#ff9f1c','#2ec4b6','#ff5a5f','#22b573','#ffd93d'];
const STATUS_META={
  0:{label:'Set status',short:'',dot:'s0'},
  1:{label:'1 · Need to learn again',short:'Learn again',dot:'s1'},
  2:{label:'2 · Revise it',short:'Revise it',dot:'s2'},
  3:{label:'3 · Completed',short:'Completed',dot:'s3'}
};

function mkTopic(t){
  if(typeof t==='string')t={text:t};
  const status=typeof t.status==='number'?t.status:(t.done?3:0);
  return{id:uid(),text:t.text,done:status===3,doneAt:status===3?Date.now():null,star:!!t.star,diff:t.diff||0,status};
}
function makeSubject(o){
  const units=(o.units&&o.units.length?o.units:Array.from({length:5},(_,i)=>({name:'Unit '+(i+1),topics:[]})));
  return{id:uid(),name:o.name,emoji:o.emoji,color:o.color,exam:o.exam||'',
    units:units.map(u=>({id:uid(),name:u.name,collapsed:false,topics:(u.topics||[]).map(mkTopic)}))};
}
const getSubject=id=>state.subjects.find(s=>s.id===id);
const activeSubject=()=>getSubject(state.active)||state.subjects[0];

function toPct(raw){if(raw>=1)return 100;let p=Math.round(raw*100);if(p>=100)p=99;if(raw>0&&p===0)p=1;return p;}
function uStats(u){
  const total=u.topics.length;
  const done=u.topics.filter(t=>t.done||t.status===3).length;
  const learnAgain=u.topics.filter(t=>t.status===1).length;
  const revise=u.topics.filter(t=>t.status===2).length;
  return{total,done,left:total-done,learnAgain,revise,raw:total?done/total:0,pct:total?toPct(done/total):0};
}
function sStats(s){
  const us=s.units.map(uStats);
  const total=us.reduce((a,x)=>a+x.total,0),done=us.reduce((a,x)=>a+x.done,0);
  const learnAgain=us.reduce((a,x)=>a+x.learnAgain,0),revise=us.reduce((a,x)=>a+x.revise,0);
  const raw=us.length?us.reduce((a,x)=>a+x.raw,0)/us.length:0;
  return{us,total,done,left:total-done,learnAgain,revise,raw,pct:toPct(raw),unitsDone:us.filter(x=>x.total>0&&x.done===x.total).length,empty:us.filter(x=>x.total===0).length};
}
function overall(){
  const ss=state.subjects.map(sStats);
  const raw=ss.length?ss.reduce((a,x)=>a+x.raw,0)/ss.length:0;
  return{pct:toPct(raw),total:ss.reduce((a,x)=>a+x.total,0),done:ss.reduce((a,x)=>a+x.done,0),
    learnAgain:ss.reduce((a,x)=>a+x.learnAgain,0),revise:ss.reduce((a,x)=>a+x.revise,0),
    units:ss.reduce((a,x)=>a+x.us.length,0),unitsDone:ss.reduce((a,x)=>a+x.unitsDone,0)};
}
function tone(p){return p>=100?'#22b573':p>=75?'#8ad94b':p>=50?'#ffd93d':p>=25?'#ff9f1c':'#ff5a5f';}
function daysTo(ds){const t=new Date(ds+'T00:00:00');const n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/DAY);}
function activeDays(){
  const set=new Set(Object.keys(state.mins).filter(k=>state.mins[k]>0));
  state.subjects.forEach(s=>s.units.forEach(u=>u.topics.forEach(t=>{if(t.done&&t.doneAt)set.add(dayKey(t.doneAt));})));
  return set;
}
function streak(){
  const set=activeDays();const d=new Date();
  if(!set.has(dayKey(d)))d.setDate(d.getDate()-1);
  let n=0;while(set.has(dayKey(d))){n++;d.setDate(d.getDate()-1);}
  return n;
}
function topicsByDay(){
  const m={};
  state.subjects.forEach(s=>s.units.forEach(u=>u.topics.forEach(t=>{if(t.done&&t.doneAt){const k=dayKey(t.doneAt);m[k]=(m[k]||0)+1;}})));
  return m;
}
function lastDays(n){
  const out=[];
  for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);out.push({key:dayKey(d),label:d.toLocaleDateString(undefined,{weekday:'short'}),isToday:i===0});}
  return out;
}
function findTopic(id){
  for(const s of state.subjects)for(const u of s.units){const t=u.topics.find(x=>x.id===id);if(t)return{s,u,t};}
  return null;
}

/* ---------- small UI builders ---------- */
const CHECK='<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function bar(key,pct,cls){
  const prev=ui.prev[key]!=null?ui.prev[key]:0;
  return `<div class="bar ${cls||''}" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><div class="fill" data-k="${key}" data-w="${pct}" style="width:${prev}%;background-color:${tone(pct)}"></div></div>`;
}
function ring(key,pct,size,sw,label,color){
  const r=(size-sw)/2,C=2*Math.PI*r,h=size/2;
  const prev=ui.prev['r'+key]!=null?ui.prev['r'+key]:0;
  return `<div class="ring" style="width:${size}px;height:${size}px;--sz:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${sw}"/><circle class="rfill" data-k="r${key}" data-w="${pct}" data-c="${C}" cx="${h}" cy="${h}" r="${r}" fill="none" stroke="${color||tone(pct)}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-prev/100)}" transform="rotate(-90 ${h} ${h})"/></svg><div class="ring-txt"><b>${pct}%</b>${label?`<small>${label}</small>`:''}</div></div>`;
}
function animate(){
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    $$('.fill[data-w]').forEach(el=>{const w=+el.dataset.w;el.style.width=w+'%';ui.prev[el.dataset.k]=w;});
    $$('.rfill[data-w]').forEach(el=>{const w=+el.dataset.w,C=+el.dataset.c;el.style.strokeDashoffset=C*(1-w/100);ui.prev[el.dataset.k]=w;});
  }));
}
function examChip(s){
  if(!s.exam)return '';
  const d=daysTo(s.exam);
  if(d<0)return '<span class="chip">Exam date passed</span>';
  const cls=d<=7?'red':d<=21?'orange':'green';
  return `<span class="chip ${cls}">📅 ${d===0?'Exam is today':d+' day'+(d>1?'s':'')+' to exam'}</span>`;
}
function pace(s){
  const st=sStats(s);
  if(st.total===0)return 'Add topics to get a daily target';
  if(st.left===0)return 'All topics covered. Hit Revise All for exams!';
  if(!s.exam)return 'Set an exam date to get a daily target';
  const d=daysTo(s.exam);
  if(d<0)return 'Exam date has passed';
  const need=Math.ceil(st.left/Math.max(d,1));
  return `About ${need} topic${need!==1?'s':''} a day to finish in time`;
}

/* ---------- badges ---------- */
const BADGES=[
  {id:'first',ico:'🌱',name:'First step',desc:'Complete your first topic',c:'#8ad94b',test:c=>c.done>=1},
  {id:'ten',ico:'🚀',name:'On a roll',desc:'Complete 10 topics',c:'#ff9f1c',test:c=>c.done>=10},
  {id:'fifty',ico:'⭐',name:'Unstoppable',desc:'Complete 50 topics',c:'#ffd93d',test:c=>c.done>=50},
  {id:'hundred',ico:'🏆',name:'Century',desc:'Complete 100 topics',c:'#ff6fb5',test:c=>c.done>=100},
  {id:'unit',ico:'🎯',name:'Unit crusher',desc:'Finish every topic in a unit',c:'#2ec4b6',test:c=>c.unitsDone>=1},
  {id:'subject',ico:'🎓',name:'Subject slayer',desc:'Finish a whole subject',c:'#8b6cff',test:c=>c.subjectsDone>=1},
  {id:'half',ico:'⛰️',name:'Halfway hero',desc:'Reach 50% overall coverage',c:'#3a86ff',test:c=>c.overall>=50},
  {id:'streak3',ico:'🔥',name:'Three in a row',desc:'Study 3 days in a row',c:'#ff9f1c',test:c=>c.streak>=3},
  {id:'streak7',ico:'⚡',name:'Week warrior',desc:'Study 7 days in a row',c:'#ff5a5f',test:c=>c.streak>=7},
  {id:'focus',ico:'⏱️',name:'Deep focus',desc:'Log 100 focus minutes',c:'#2ec4b6',test:c=>c.mins>=100}
];
function badgeCtx(){
  const ss=state.subjects.map(sStats);
  return{done:ss.reduce((a,x)=>a+x.done,0),unitsDone:ss.reduce((a,x)=>a+x.unitsDone,0),
    subjectsDone:ss.filter(x=>x.pct===100).length,overall:overall().pct,streak:streak(),
    mins:Object.values(state.mins).reduce((a,b)=>a+b,0)};
}
function checkBadges(silent){
  const c=badgeCtx();let changed=false;
  BADGES.forEach(b=>{
    if(!state.badges[b.id]&&b.test(c)){state.badges[b.id]=Date.now();changed=true;if(!silent)toast(`${b.ico} Badge unlocked: ${b.name}`);}
  });
  if(changed){save();if(ui.view==='dashboard')render();}
}

/* ---------- views ---------- */
const QUOTES=["Small progress is still progress.","You don't need to be perfect, just consistent.","One topic today beats ten topics someday.","Future you will be glad you started.","Study in sprints, rest in full.","Every tick is a tiny victory.","Start before you feel ready.","Revision is just meeting a topic for the second time.","Discipline is picking what you want most over what you want now.","The syllabus is big, but it only gets smaller."];

function emptyState(){
  return `<div class="card empty"><div class="big-emoji">📚</div><h2>Let's set up your semester</h2>
  <p>Add a subject, split it into units, list the topics, then tick them off as you study. Your progress bars fill up as you go.</p>
  <div class="row" style="justify-content:center"><button class="btn primary" data-action="new-subject">Add my first subject</button><button class="btn" data-action="sample">Try with sample subjects</button></div></div>`;
}

function vDash(){
  const subs=state.subjects;
  if(!subs.length)return emptyState();
  const o=overall(),sk=streak(),tk=dayKey(new Date());
  const byDay=topicsByDay(),todayDone=byDay[tk]||0;
  const days=lastDays(7);
  const hr=new Date().getHours();
  const greet=hr<5?'Burning the midnight oil':hr<12?'Good morning':hr<17?'Good afternoon':hr<22?'Good evening':'Late night grind';
  const nm=state.name?', '+esc(state.name):'';
  let lead;
  if(o.total===0)lead='Add topics to your units and this page comes alive.';
  else if(o.pct===0)lead='Fresh start. Tick off your first topic today.';
  else if(o.pct<25)lead='Good start. Small steps add up fast.';
  else if(o.pct<50)lead='Momentum is building. Keep the streak alive.';
  else if(o.pct<75)lead='Past halfway. The finish line is in sight.';
  else if(o.pct<100)lead='Almost there. One last push.';
  else lead='Syllabus conquered. Hit Revise All to prep for exams!';
  const stat=(ico,c,val,label)=>`<div class="stat"><div class="ico" style="background:${c}">${ico}</div><div><b>${val}</b><span>${label}</span></div></div>`;

  const subjCards=subs.map(s=>{
    const st=sStats(s);
    return `<div class="subj-card" role="button" tabindex="0" style="--sc:${s.color}" data-action="open-subject" data-s="${s.id}">
      <div class="sc-top"><span class="em">${s.emoji}</span><div class="grow"><b>${esc(s.name)}</b><small>${st.done} of ${st.total} green · ${st.revise} revise · ${st.learnAgain} relearn</small></div><span class="pctb" style="background:${tone(st.pct)}">${st.pct}%</span></div>
      ${bar('dc-'+s.id,st.pct)}
      <div class="minisegs" style="--n:${s.units.length}">${st.us.map((x,i)=>`<i title="Unit ${i+1}: ${x.pct}%" style="${x.total?'background:'+tone(x.pct):''}"></i>`).join('')}</div>
      <div class="row">${examChip(s)||'<span class="chip">No exam date set</span>'}${st.revise?`<span class="chip yellow">🔄 ${st.revise} to revise</span>`:''}${st.learnAgain?`<span class="chip red">⚠️ ${st.learnAgain} learn again</span>`:''}</div>
    </div>`;
  }).join('');

  const wkVals=days.map(d=>({label:d.label,v:byDay[d.key]||0,today:d.isToday}));
  const wkMax=Math.max(3,...wkVals.map(x=>x.v));
  const wk=`<div class="wk">${wkVals.map(x=>`<div class="wk-c ${x.today?'today':''}"><span class="wk-v">${x.v||''}</span><div class="wk-bar"><i class="${x.v?'':'z'}" style="height:${x.v/wkMax*100}%"></i></div><small>${x.label}</small></div>`).join('')}</div>`;

  const allU=subs.flatMap(s=>s.units.map(u=>uStats(u)));
  const nDone=allU.filter(x=>x.total>0&&x.done===x.total).length;
  const nProg=allU.filter(x=>x.done>0&&x.done<x.total).length;
  const nNone=allU.length-nDone-nProg;
  const a=nDone/allU.length*100,b=a+nProg/allU.length*100;
  const donut=`<div class="donut-wrap"><div class="donut" style="background:conic-gradient(#22b573 0 ${a}%,#ffd93d ${a}% ${b}%,var(--track) ${b}% 100%)"><div class="hole"><div><b>${nDone}</b><br><small>of ${allU.length} units done</small></div></div></div>
    <div class="legend"><div><i style="background:#22b573"></i>${nDone} finished</div><div><i style="background:#ffd93d"></i>${nProg} in progress</div><div><i style="background:var(--track)"></i>${nNone} not started</div></div></div>`;

  const maxU=Math.max(...subs.map(s=>s.units.length));
  const heat=`<div class="heat" style="--n:${maxU}"><span></span>${Array.from({length:maxU},(_,i)=>`<span class="hh">Unit ${i+1}</span>`).join('')}
    ${subs.map(s=>{const st=sStats(s);return `<span class="hl">${s.emoji} ${esc(s.name)}</span>`+Array.from({length:maxU},(_,i)=>{
      const u=s.units[i];if(!u)return '<span></span>';const x=st.us[i];
      return x.total?`<div class="hc" role="button" tabindex="0" data-action="goto" data-s="${s.id}" data-u="${u.id}" title="${esc(u.name)}: ${x.done} of ${x.total}" style="background:${tone(x.pct)}">${x.pct}%</div>`
                    :`<div class="hc none" role="button" tabindex="0" data-action="goto" data-s="${s.id}" data-u="${u.id}" title="${esc(u.name)}: no topics yet">–</div>`;}).join('');}).join('')}</div>
    <div class="keybar">Colour key:<i style="background:#ff5a5f"></i>under 25%<i style="background:#ff9f1c"></i>25 to 49%<i style="background:#ffd93d"></i>50 to 74%<i style="background:#8ad94b"></i>75 to 99%<i style="background:#22b573"></i>done</div>`;

  const attn=[];
  subs.forEach(s=>s.units.forEach((u,i)=>{const x=uStats(u);if(x.pct<100)attn.push({s,u,i,x});}));
  attn.sort((p,q)=>((p.x.total===0)-(q.x.total===0))||(p.x.pct-q.x.pct));

/* focus timer */
const timer={mode:'focus',total:state.pomo.focus*60,left:state.pomo.focus*60,running:false,endAt:0,iv:null,subj:'',topic:''};
const fmt=s=>pad(Math.floor(s/60))+':'+pad(s%60);
function modeMins(m){return state.pomo[m];}
function vFocus(){
  const tk=dayKey(new Date()),days=lastDays(7);
  const vals=days.map(d=>({label:d.label,v:state.mins[d.key]||0,today:d.isToday}));
  const mx=Math.max(30,...vals.map(x=>x.v));
  const totalMins=Object.values(state.mins).reduce((a,b)=>a+b,0);
  const s=getSubject(timer.subj);
  const pend=s?s.units.flatMap(u=>u.topics.filter(t=>!t.done).map(t=>({id:t.id,text:t.text,unit:u.name}))):[];
  const durs=timer.mode==='focus'?[15,25,45,60]:timer.mode==='short'?[5,10]:[15,20,30];
  const size=250,sw=16,r=(size-sw)/2,C=2*Math.PI*r,h=size/2;
  const frac=timer.total?(timer.total-timer.left)/timer.total:0;
  const col=timer.mode==='focus'?'#3a86ff':'#22b573';
  return `<div class="stack"><div class="cols">
   <section class="card focus">
     <div class="modes">${[['focus','Focus'],['short','Short break'],['long','Long break']].map(m=>`<button class="${timer.mode===m[0]?'on':''}" data-action="t-mode" data-m="${m[0]}">${m[1]}</button>`).join('')}</div>
     <div class="ring tm-ring" style="width:${size}px;height:${size}px;max-width:100%;--sz:${size}px">
       <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${sw}"/><circle id="trf" data-c="${C}" cx="${h}" cy="${h}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}" transform="rotate(-90 ${h} ${h})" style="transition:stroke-dashoffset .3s linear"/></svg>
       <div class="ring-txt"><b id="tm">${fmt(timer.left)}</b><small>${timer.mode==='focus'?'stay with one topic':'rest your eyes'}</small></div>
     </div>
     <div class="row" style="justify-content:center"><button class="btn primary" id="tplay" data-action="t-toggle">Start</button><button class="btn" data-action="t-reset">Reset</button></div>
     <div class="durs">${durs.map(m=>`<button class="fchip ${modeMins(timer.mode)===m?'on':''}" data-action="t-dur" data-m="${m}">${m} min</button>`).join('')}</div>
     ${timer.mode==='focus'?`<div class="pickrow">
        <div><label class="lbl" for="f-subj">What are you studying? <small>(optional)</small></label>
        <select id="f-subj" class="inp"><option value="">Any subject</option>${state.subjects.map(x=>`<option value="${x.id}" ${x.id===timer.subj?'selected':''}>${x.emoji} ${esc(x.name)}</option>`).join('')}</select></div>
        ${s?`<div><label class="lbl" for="f-topic">Topic to finish this session</label>
        <select id="f-topic" class="inp"><option value="">No specific topic</option>${pend.map(t=>`<option value="${t.id}" ${t.id===timer.topic?'selected':''}>${esc(t.text)} (${esc(t.unit)})</option>`).join('')}</select></div>`:''}
     </div>`:''}
   </section>
   <section class="card">
     <h2>Focus minutes this week</h2>
     <div class="wk">${vals.map(x=>`<div class="wk-c ${x.today?'today':''}"><span class="wk-v">${x.v||''}</span><div class="wk-bar"><i class="${x.v?'':'z'}" style="height:${x.v/mx*100}%"></i></div><small>${x.label}</small></div>`).join('')}</div>
     <div class="mini-stats" style="margin-top:16px"><span class="chip">🎯 ${state.sess[tk]||0} sessions today</span><span class="chip">⚡ ${state.mins[tk]||0} min today</span><span class="chip">⏱️ ${totalMins} min in total</span></div>
     <p class="muted" style="margin:14px 0 0;font-size:14px">Tip: 25 minutes on, 5 minutes off. After four rounds, take a longer break. Finished sessions count towards your streak.</p>
   </section></div></div>`;
}
function paintTimer(){
  const t=fmt(timer.left);
  const tm=$('#tm');if(tm)tm.textContent=t;
  const rf=$('#trf');if(rf){const C=+rf.dataset.c;const frac=timer.total?(timer.total-timer.left)/timer.total:0;rf.style.strokeDashoffset=C*(1-frac);}
  const pb=$('#tplay');if(pb)pb.textContent=timer.running?'Pause':(timer.left<timer.total?'Resume':'Start');
  const pill=$('#pill');if(pill){pill.hidden=!(timer.running&&ui.view!=='focus');const pt=$('#pilltime');if(pt)pt.textContent=t;}
  document.title=timer.running?`${t} · SyllabusPal`:APP_TITLE;
}
function addMins(m){const k=dayKey(new Date());state.mins[k]=(state.mins[k]||0)+m;}
function setMode(m){stopTimer();timer.mode=m;timer.total=modeMins(m)*60;timer.left=timer.total;render();}
function stopTimer(){clearInterval(timer.iv);timer.running=false;}
function startTimer(){
  if(timer.running)return;
  timer.running=true;timer.endAt=Date.now()+timer.left*1000;
  timer.iv=setInterval(tick,250);paintTimer();
}
function tick(){
  const left=Math.max(0,Math.round((timer.endAt-Date.now())/1000));
  timer.left=left;paintTimer();
  if(left<=0)finishTimer();
}
function pauseTimer(){if(!timer.running)return;tick();if(timer.running){stopTimer();paintTimer();}}
function resetTimer(){
  const left=timer.running?Math.max(0,Math.round((timer.endAt-Date.now())/1000)):timer.left;
  const el=timer.total-left;
  stopTimer();
  if(timer.mode==='focus'&&el>=60){const m=Math.floor(el/60);addMins(m);save();toast(`Logged ${m} focus minute${m>1?'s':''}`);checkBadges();}
  timer.left=timer.total;render();
}
function beep(){
  try{
    const A=window.AudioContext||window.webkitAudioContext;const c=new A();
    [0,.25,.5].forEach((d,i)=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);
      o.frequency.value=i===2?880:660;const t=c.currentTime+d;
      g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.25,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.22);
      o.start(t);o.stop(t+.25);});
  }catch(e){}
}
function finishTimer(){
  stopTimer();beep();
  const wasFocus=timer.mode==='focus';
  if(wasFocus){
    const m=Math.round(timer.total/60);addMins(m);
    const k=dayKey(new Date());state.sess[k]=(state.sess[k]||0)+1;
    toast(`🎉 Focus session done, +${m} min`);confetti(90);
  }else toast('Break over. Ready for the next round? 💪');
  timer.left=timer.total;save();render();
  if(wasFocus&&timer.topic){
    const f=findTopic(timer.topic);
    if(f&&!f.t.done){
      confirmBox(`Did you finish "${f.t.text}"?`,'Yes, mark it completed',()=>{
        const bu=uStats(f.u).pct,bs=sStats(f.s).pct;
        f.t.done=true;f.t.status=3;f.t.doneAt=Date.now();timer.topic='';save();render();celebrate(f.s,f.u,bu,bs);checkBadges();
      });
    }
  }
  checkBadges();
}

/* ---------- render ---------- */
function theme(){return state.theme||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}
function render(){
  document.documentElement.setAttribute('data-theme',theme());
  $('#themebtn').textContent=theme()==='dark'?'☀️':'🌙';
  $$('.navbtn').forEach(b=>b.classList.toggle('on',b.dataset.view===ui.view));
  const m=$('#main');
  m.innerHTML=ui.view==='dashboard'?vDash():ui.view==='tracker'?vTracker():vFocus();
  if(ui.view==='tracker')applyFilter();
  paintTimer();
  animate();
  if(ui.focusSel){const f=$(ui.focusSel);if(f)f.focus();ui.focusSel=null;}
  ui.pop=null;ui.popUnit=null;
}
function applyFilter(){
  const q=ui.q.trim().toLowerCase();
  $$('.topic').forEach(el=>{
    const done=el.dataset.done==='1',star=el.dataset.star==='1',st=+el.dataset.status;
    let show=true;
    if(ui.filter==='pending')show=!done;
    if(ui.filter==='done'||ui.filter==='s3')show=(st===3||done);
    if(ui.filter==='s1')show=(st===1);
    if(ui.filter==='s2')show=(st===2);
    if(ui.filter==='star')show=star;
    if(q&&!el.dataset.text.includes(q))show=false;
    el.classList.toggle('hide',!show);
  });
  $$('.unit-b').forEach(b=>{
    const total=$$('.topic',b).length,any=$$('.topic:not(.hide)',b).length;
    const nm=$('.nomatch',b);if(nm)nm.hidden=!(total>0&&any===0);
  });
}

/* ---------- toast, modal, confetti ---------- */
function toast(msg,undo){
  const el=document.createElement('div');el.className='toast';
  const sp=document.createElement('span');sp.textContent=msg;el.appendChild(sp);
  if(undo){const b=document.createElement('button');b.textContent='Undo';b.onclick=()=>{undo();el.remove();};el.appendChild(b);}
  $('#toasts').appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),300);},undo?5000:3000);
}
function openModal(html,mount){
  closeModal();
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  ov.addEventListener('mousedown',e=>{if(e.target===ov)closeModal();});
  document.body.appendChild(ov);ui.modal=ov;
  const m=$('.modal',ov);if(mount)mount(m);
  setTimeout(()=>{const f=$('input:not([type=date]),textarea',ov);if(f)f.focus();},30);
  return m;
}
function closeModal(){if(ui.modal){ui.modal.remove();ui.modal=null;}}
function confirmBox(msg,okLabel,cb){
  openModal(`<h3>Are you sure?</h3><p>${esc(msg)}</p><div class="mactions"><span class="grow"></span><button class="btn" id="c-no">Cancel</button><button class="btn primary" id="c-yes">${esc(okLabel)}</button></div>`,m=>{
    $('#c-no',m).onclick=closeModal;$('#c-yes',m).onclick=()=>{closeModal();cb();};
  });
}
function askText(o,cb){
  openModal(`<h3>${esc(o.title)}</h3><label class="lbl" for="a-v">${esc(o.label)}</label>${o.multi?`<textarea id="a-v" class="inp" rows="8" placeholder="${esc(o.placeholder||'')}"></textarea>`:`<input id="a-v" class="inp" maxlength="140" value="${esc(o.value||'')}">`}<div class="mactions"><span class="grow"></span><button class="btn" id="a-no">Cancel</button><button class="btn primary" id="a-yes">${esc(o.ok||'Save')}</button></div>`,m=>{
    const inp=$('#a-v',m);
    const go=()=>{const v=inp.value.trim();if(!v)return;closeModal();cb(v);};
    $('#a-no',m).onclick=closeModal;$('#a-yes',m).onclick=go;
    if(!o.multi)inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  });
}
const cv=$('#confetti'),cx=cv.getContext('2d');let parts=[],raf=null;
function sizeCv(){cv.width=window.innerWidth;cv.height=window.innerHeight;}
function confetti(n){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  sizeCv();const cols=['#ff5a5f','#ff9f1c','#ffd93d','#8ad94b','#3a86ff','#8b6cff','#ff6fb5','#2ec4b6'];
  for(let i=0;i<(n||140);i++)parts.push({x:cv.width/2+(Math.random()-.5)*cv.width*.3,y:cv.height*.4,vx:(Math.random()-.5)*15,vy:-Math.random()*15-4,g:.38,s:7+Math.random()*7,c:cols[i%cols.length],r:Math.random()*6.28,vr:(Math.random()-.5)*.4,life:0});
  if(!raf)loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;p.life++;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore();});
  parts=parts.filter(p=>p.y<cv.height+30&&p.life<240);
  if(parts.length)raf=requestAnimationFrame(loop);else{raf=null;cx.clearRect(0,0,cv.width,cv.height);}
}
window.addEventListener('resize',()=>{if(parts.length)sizeCv();});

const SAMPLES=[
 {name:'Data Structures',emoji:'💻',color:'#3a86ff',units:[
  {name:'Introduction and arrays',topics:['Time and space complexity','Asymptotic notations','Arrays and 2D arrays','Linear and binary search','Basic sorting techniques']},
  {name:'Linked lists, stacks and queues',topics:['Singly linked list','Doubly and circular linked lists','Stack operations','Infix to postfix conversion','Queue and circular queue','Priority queue']},
  {name:'Trees',topics:['Binary trees and traversals','Binary search tree operations','AVL trees','Heaps and heap sort','B-trees']},
  {name:'Graphs',topics:['Graph representations','BFS and DFS','Dijkstra shortest path','Minimum spanning trees','Topological sort']},
  {name:'Hashing and advanced sorting',topics:['Hash functions','Collision resolution','Merge sort','Quick sort','Radix and counting sort']}]},
 {name:'Engineering Mathematics',emoji:'📐',color:'#ff9f1c',units:[
  {name:'Matrices',topics:['Rank of a matrix','Eigenvalues and eigenvectors','Cayley-Hamilton theorem','Diagonalisation']},
  {name:'Differential calculus',topics:['Successive differentiation','Partial derivatives',"Euler's theorem",'Maxima and minima']},
  {name:'Integral calculus',topics:['Beta and Gamma functions','Double integrals','Triple integrals','Change of variables']},
  {name:'Differential equations',topics:['First-order equations','Constant coefficient equations','Variation of parameters','Cauchy-Euler equation']},
  {name:'Vector calculus',topics:['Gradient, divergence and curl','Line and surface integrals',"Green's theorem",'Gauss and Stokes theorems']}]}
];
function loadSamples(){
  SAMPLES.forEach((sm,si)=>{
    const s=makeSubject({name:sm.name,emoji:sm.emoji,color:sm.color,exam:dayKey(Date.now()+(si?34:27)*DAY),units:sm.units});
    let k=0;
    s.units.forEach((u,a)=>u.topics.forEach((t,b)=>{
      const want=si===0?(a===0||(a===1&&b<4)||(a===2&&b<2)):((a===0&&b<3)||(a===1&&b<1));
      if(want){t.done=true;t.status=3;t.doneAt=Date.now()-(k++%6)*DAY-Math.random()*2e6;}
      else if(a===1&&b===4){t.status=2;}
      else if(a===2&&b===2){t.status=1;}
    }));
    if(si===0){s.units[2].topics[3].diff=3;s.units[3].topics[2].star=true;s.units[3].topics[2].diff=2;}
    state.subjects.push(s);
  });
  state.active=state.subjects[state.subjects.length-SAMPLES.length].id;
  save();checkBadges(true);render();toast('Sample subjects added. Delete them any time from Edit subject.');
}

/* ---------- actions ---------- */
function celebrate(s,u,bu,bs){
  const au=uStats(u).pct,as=sStats(s).pct;
  if(as===100&&bs<100){ui.popUnit=u.id;render();confetti(280);toast(`🎉 ${s.name} fully covered!`);}
  else if(au===100&&bu<100){ui.popUnit=u.id;render();confetti(150);toast(`🎉 ${u.name} complete!`);}
}
function curUnit(el){const s=activeSubject();const ue=el.closest('[data-u]');return{s,u:s.units.find(x=>x.id===ue.dataset.u)};}
function scrollToUnit(id){setTimeout(()=>{const e=document.getElementById('u-'+id);if(e){e.scrollIntoView({behavior:'smooth',block:'start'});e.classList.add('flash');}},60);}
function addTopicFrom(inp){
  const txt=inp.value.trim();if(!txt)return;
  const{u}=curUnit(inp);u.topics.push(mkTopic(txt));u.collapsed=false;save();
  ui.focusSel=`#u-${u.id} .addinp`;render();
}
function applyTopicStatus(t,newStatus){
  t.status=newStatus;
  if(newStatus===3){
    t.done=true;
    t.doneAt=t.doneAt||Date.now();
  }else{
    t.done=false;
    t.doneAt=null;
  }
}

const actions={
  nav(el){ui.view=el.dataset.view;render();window.scrollTo({top:0});},
  theme(){state.theme=theme()==='dark'?'light':'dark';save();render();},
  settings(){settingsModal();},
  'open-auth'(){authModal();},
  'sign-out'(){if(window.__authSignOut)window.__authSignOut();},
  'new-subject'(){subjectModal();},
  sample(){loadSamples();},
  'pick-subject'(el){state.active=el.dataset.s;save();render();},
  'open-subject'(el){state.active=el.dataset.s;ui.view='tracker';save();render();window.scrollTo({top:0});},
  goto(el){
    state.active=el.dataset.s;ui.view='tracker';
    const u=activeSubject().units.find(x=>x.id===el.dataset.u);if(u)u.collapsed=false;
    save();render();scrollToUnit(el.dataset.u);
  },
  jump(el){
    const u=activeSubject().units.find(x=>x.id===el.dataset.u);
    if(u&&u.collapsed){u.collapsed=false;save();render();}
    scrollToUnit(el.dataset.u);
  },
  'edit-subject'(){subjectModal(activeSubject());},
  'toggle-unit'(el){const{u}=curUnit(el);u.collapsed=!u.collapsed;save();render();},
  'rename-unit'(el){const{u}=curUnit(el);askText({title:'Rename unit',label:'Unit name',value:u.name},v=>{u.name=v;save();render();});},
  'add-unit'(){const s=activeSubject();s.units.push({id:uid(),name:'Unit '+(s.units.length+1),collapsed:false,topics:[]});save();render();toast('Unit added');},
  'del-unit'(el){
    const{s,u}=curUnit(el);
    const go=()=>{s.units=s.units.filter(x=>x.id!==u.id);save();render();toast('Unit removed');};
    if(u.topics.length)confirmBox(`Remove "${u.name}" and its ${u.topics.length} topics?`,'Remove unit',go);else go();
  },
  'toggle-topic'(el){
    const tr=el.closest('.topic');const{s,u}=curUnit(tr);const t=u.topics.find(x=>x.id===tr.dataset.t);
    const bu=uStats(u).pct,bs=sStats(s).pct;
    const nextStatus=t.done?0:3;
    applyTopicStatus(t,nextStatus);
    ui.pop=t.done?t.id:null;
    save();render();celebrate(s,u,bu,bs);checkBadges();
  },
  'set-status'(el){
    const tr=el.closest('.topic');const{s,u}=curUnit(tr);const t=u.topics.find(x=>x.id===tr.dataset.t);
    const bu=uStats(u).pct,bs=sStats(s).pct;
    const target=+el.dataset.status;
    const nextStatus=(t.status===target)?0:target;
    applyTopicStatus(t,nextStatus);
    ui.pop=t.done?t.id:null;
    save();render();celebrate(s,u,bu,bs);checkBadges();
  },
  'cycle-diff'(el){const tr=el.closest('.topic');const{u}=curUnit(tr);const t=u.topics.find(x=>x.id===tr.dataset.t);t.diff=(t.diff+1)%4;save();render();},
  star(el){const tr=el.closest('.topic');const{u}=curUnit(tr);const t=u.topics.find(x=>x.id===tr.dataset.t);t.star=!t.star;save();render();},
  'edit-topic'(el){const tr=el.closest('.topic');const{u}=curUnit(tr);const t=u.topics.find(x=>x.id===tr.dataset.t);askText({title:'Edit topic',label:'Topic',value:t.text},v=>{t.text=v;save();render();});},
  'del-topic'(el){
    const tr=el.closest('.topic');const{u}=curUnit(tr);const i=u.topics.findIndex(x=>x.id===tr.dataset.t);const t=u.topics[i];
    u.topics.splice(i,1);save();render();
    toast('Topic deleted',()=>{u.topics.splice(Math.min(i,u.topics.length),0,t);save();render();});
  },
  'add-topic'(el){addTopicFrom($('.addinp',el.closest('.unit-b')));},
  bulk(el){
    const{u}=curUnit(el);
    askText({title:'Bulk add topics',label:'Paste your syllabus list, one topic per line',multi:true,placeholder:'Binary trees\nTree traversals\nAVL trees',ok:'Add topics'},v=>{
      const lines=v.split('\n').map(x=>x.replace(/^\s*(?:[-*•]|\d+[.)])\s+/,'').trim()).filter(Boolean);
      lines.forEach(l=>u.topics.push(mkTopic(l.slice(0,140))));u.collapsed=false;save();render();toast(`${lines.length} topic${lines.length!==1?'s':''} added`);
    });

  'mark-all'(el){

    const prev=u.topics.map(t=>({id:t.id,status:t.status,done:t.done,doneAt:t.doneAt}));

    save();render();celebrate(s,u,bu,bs);checkBadges();
    toast(`✅ All topics in "${u.name}" marked Completed`,()=>{
      prev.forEach(p=>{const t=u.topics.find(x=>x.id===p.id);if(t){t.status=p.status;t.done=p.done;t.doneAt=p.doneAt;}});
      save();render();
    });
  },
  'revise-unit'(el){
    const{u}=curUnit(el);
    if(!u.topics.length){toast('Add topics to this unit first');return;}
    const prev=u.topics.map(t=>({id:t.id,status:t.status,done:t.done,doneAt:t.doneAt}));
    u.topics.forEach(t=>applyTopicStatus(t,2));
    save();render();
    toast(`🔄 "${u.name}" set to Revise it`,()=>{
      prev.forEach(p=>{const t=u.topics.find(x=>x.id===p.id);if(t){t.status=p.status;t.done=p.done;t.doneAt=p.doneAt;}});
      save();render();
    });
  },
  'relearn-unit'(el){
    const{u}=curUnit(el);
    if(!u.topics.length){toast('Add topics to this unit first');return;}
    const prev=u.topics.map(t=>({id:t.id,status:t.status,done:t.done,doneAt:t.doneAt}));
    u.topics.forEach(t=>applyTopicStatus(t,1));
    save();render();
    toast(`⚠️ "${u.name}" set to Need to learn again`,()=>{
      prev.forEach(p=>{const t=u.topics.find(x=>x.id===p.id);if(t){t.status=p.status;t.done=p.done;t.doneAt=p.doneAt;}});
      save();render();
    });
  },
  'revise-all-subject'(){
    const s=activeSubject();
    const allTopics=s.units.flatMap(u=>u.topics);
    if(!allTopics.length){toast('No topics in this subject yet');return;}
    const prev=allTopics.map(t=>({id:t.id,status:t.status,done:t.done,doneAt:t.doneAt}));

    save();render();
    toast(`🔄 Exam mode: all ${allTopics.length} topics in "${s.name}" set to Revise it`,()=>{
      prev.forEach(p=>{
        for(const u of s.units){const t=u.topics.find(x=>x.id===p.id);if(t){t.status=p.status;t.done=p.done;t.doneAt=p.doneAt;break;}}
      });
      save();render();
    });
  },
  'reset-unit'(el){
    const{u}=curUnit(el);
    u.topics.forEach(t=>applyTopicStatus(t,0));
    save();render();
  },
  filter(el){ui.filter=el.dataset.f;render();},
  'expand-all'(){activeSubject().units.forEach(u=>u.collapsed=false);save();render();},
  'collapse-all'(){activeSubject().units.forEach(u=>u.collapsed=true);save();render();},
  't-toggle'(){if(timer.running)pauseTimer();else startTimer();},
  't-reset'(){resetTimer();},
  't-mode'(el){setMode(el.dataset.m);},
  't-dur'(el){const m=+el.dataset.m;state.pomo[timer.mode]=m;save();stopTimer();timer.total=m*60;timer.left=timer.total;render();}
};

checkBadges(true);

    measurementId: "G-T9MTD6DLVT"
  };

  const app = initializeApp(firebaseConfig);
  try { getAnalytics(app); } catch (e) {}
  const auth = getAuth(app);
  const db = getFirestore(app);
  const googleProvider = new GoogleAuthProvider();

  const signInBtn = document.getElementById("signin-btn");
  const signOutBtn = document.getElementById("signout-btn");
  const userBadge = document.getElementById("user-badge");
  const syncBadge = document.getElementById("sync-badge");

  let currentUser = null;
  let syncTimeout = null;

  function setSyncStatus(text) {
    if (!syncBadge) return;
    syncBadge.hidden = !currentUser;
    syncBadge.textContent = text;
  }

  // Save user progress to Firestore automatically (debounced)
  window.__syncToFirebase = function(stateObj) {
    if (!currentUser) return;
    setSyncStatus("☁️ Syncing...");
    clearTimeout(syncTimeout);
    syncTimeout = setTimeout(async () => {
      try {
        const userRef = doc(db, "users", currentUser.uid);
        await setDoc(userRef, {
          progress: JSON.parse(JSON.stringify(stateObj)),
          updatedAt: Date.now(),
          email: currentUser.email || ""
        }, { merge: true });
        setSyncStatus("☁️ Saved");
      } catch (err) {
        console.error("Error saving progress:", err);
        setSyncStatus("⚠️ Sync error");
      }
    }, 350);
  };

  // Auth Handlers
  window.__authGoogle = async function() {
    try {
      await signInWithPopup(auth, googleProvider);
      if (window.__closeAuthModal) window.__closeAuthModal();
    } catch (err) {
      if (window.__toast) window.__toast("Sign in failed: " + (err.message || "Check Firebase Auth settings"));
    }
  };

  window.__authEmailLogin = async function(email, pass) {
    try {
      await signInWithEmailAndPassword(auth, email, pass);
      if (window.__closeAuthModal) window.__closeAuthModal();
    } catch (err) {
      if (window.__toast) window.__toast("Login error: " + (err.message || "Invalid credentials"));
    }
  };

  window.__authEmailSignup = async function(email, pass) {
    try {
      await createUserWithEmailAndPassword(auth, email, pass);
      if (window.__closeAuthModal) window.__closeAuthModal();
    } catch (err) {
      if (window.__toast) window.__toast("Sign up error: " + (err.message || "Could not create account"));
    }
  };

  window.__authSignOut = async function() {
    try {
      await signOut(auth);
      if (window.__toast) window.__toast("Signed out");
    } catch (err) {
      console.error("Sign out error:", err);
    }
  };

  // Listen for Sign In / Sign Out and auto-load/save user progress
  onAuthStateChanged(auth, async (user) => {
    currentUser = user;
    if (user) {
      signInBtn.hidden = true;
      signOutBtn.hidden = false;
      userBadge.hidden = false;
      userBadge.textContent = "👤 " + (user.displayName || user.email || "User");
      setSyncStatus("☁️ Loading...");

      try {
        const userRef = doc(db, "users", user.uid);
        const snap = await getDoc(userRef);
        const localState = window.__getLocalState ? window.__getLocalState() : null;

        if (snap.exists() && snap.data().progress) {
          const cloudProgress = snap.data().progress;
          if ((cloudProgress.subjects && cloudProgress.subjects.length > 0) || !localState?.subjects?.length) {
            if (!cloudProgress.name && user.displayName) {
              cloudProgress.name = user.displayName.split(" ")[0];
            }
            window.__loadCloudState(cloudProgress);
            if (window.__toast) window.__toast("☁️ Progress loaded from cloud");
          } else if (localState && localState.subjects && localState.subjects.length > 0) {
            window.__syncToFirebase(localState);
          }
        } else if (localState) {
          if (!localState.name && user.displayName) {
            localState.name = user.displayName.split(" ")[0];
            window.__loadCloudState(localState);
          }
          window.__syncToFirebase(localState);
          if (window.__toast) window.__toast("☁️ Local progress backed up to cloud");
        }
        setSyncStatus("☁️ Saved");
      } catch (err) {
        console.error("Error loading cloud progress:", err);
        setSyncStatus("⚠️ Offline");
      }
    } else {
      signInBtn.hidden = false;
      signOutBtn.hidden = true;
      userBadge.hidden = true;
      syncBadge.hidden = true;
    }
  });
</script>
</body>
</html>
